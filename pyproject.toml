[project]
name = "fleet-watchdog"
version = "0.1.0"
description = "Push-based heartbeat watchdog for a fleet of LAN bots (OpenClaw, Hermes). Alerts via Telegram when a bot goes dark."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
fleet-watchdog = "fleet_watchdog.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_watchdog"]

[tool.ruff]
line-length = 100
target-version = "py311"
